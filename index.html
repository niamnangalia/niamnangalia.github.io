<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Carter Clicker</title><style>
*{box-sizing:border-box}body{margin:0;background:#08090d;color:#f5f7fb;font:14px Inter,system-ui,sans-serif}button{color:inherit;font:inherit}.app{max-width:1400px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:18px}.brand{display:flex;gap:12px;align-items:center}.logo{width:42px;height:42px;border-radius:13px;background:#ff6b35;color:#111;display:grid;place-items:center;font-weight:1000}.brand h1{margin:0;font-size:21px}.muted{color:#858d9c;font-size:12px}.stats{display:flex;gap:9px}.stat,.card{background:#10131a;border:1px solid #242a35;border-radius:18px}.stat{padding:9px 13px;min-width:110px}.stat span{display:block;color:#858d9c;font-size:10px;text-transform:uppercase}.stat b{font-size:17px}.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:18px}.hero{min-height:650px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;background:radial-gradient(circle at 50% 45%,#ff6b3515,transparent 34%),#10131a}.balance{font-size:43px;font-weight:950}.balance small{font-size:12px;color:#858d9c}.click{width:350px;height:370px;display:grid;place-items:center;position:relative;cursor:pointer}.ring{position:absolute;width:315px;height:315px;border-radius:50%;border:1px solid #ff6b3540;box-shadow:0 0 80px #ff6b3520}.ring:after{content:"";position:absolute;inset:35px;border:1px dashed #ff9d5c25;border-radius:50%}#carter{width:235px;height:235px;object-fit:contain;filter:drop-shadow(0 25px 30px #000);transition:.08s}#carter:active{transform:scale(.93)}.combo{height:22px;color:#ffd166;font-weight:800}.buttons{display:flex;gap:8px}.btn,.buy{background:#171b23;border:1px solid #2a303c;border-radius:10px;padding:9px 12px;cursor:pointer}.btn:hover,.buy:hover{border-color:#ff6b35}.side{overflow:hidden;min-height:650px}.tabs{display:flex;padding:9px;border-bottom:1px solid #242a35;gap:5px}.tab{border:0;background:none;padding:9px 11px;border-radius:9px;color:#858d9c;cursor:pointer}.tab.active{background:#1b2029;color:white}.panel{padding:13px;max-height:595px;overflow:auto}.list{display:grid;gap:8px}.item{background:#131720;border:1px solid #202631;border-radius:12px;padding:11px;display:grid;grid-template-columns:1fr auto;gap:8px}.item h3{margin:0;font-size:13px}.item p{margin:3px 0 0;color:#858d9c;font-size:11px}.price{color:#ffd166;font-weight:900}.buy{padding:6px 10px;margin-top:6px}.buy:disabled{opacity:.4;cursor:not-allowed}.hidden{display:none}.ach{grid-template-columns:35px 1fr auto}.icon{width:34px;height:34px;border-radius:9px;background:#20252e;display:grid;place-items:center}.unlocked .icon{color:#ffd166;background:#3b2c1d}.toast{position:fixed;right:18px;bottom:18px;background:#181c24;border:1px solid #343b49;border-left:3px solid #ff6b35;border-radius:11px;padding:12px;box-shadow:0 20px 50px #0008}.toast b{display:block}.toast span{color:#858d9c;font-size:11px}@media(max-width:850px){.grid{grid-template-columns:1fr}.stats{display:none}.hero{min-height:560px}.side{min-height:560px}}@media(max-width:500px){.app{padding:10px}.click{width:300px;height:320px}.ring{width:270px;height:270px}#carter{width:205px;height:205px}.balance{font-size:34px}}
</style></head><body><div class="app"><header class="top"><div class="brand"><div class="logo">C</div><div><h1>Carter Clicker</h1><div class="muted">Niamverse Original • Day 1</div></div></div><div class="stats"><div class="stat"><span>Per click</span><b id="pc">1</b></div><div class="stat"><span>Per second</span><b id="cps">0</b></div><div class="stat"><span>Achievements</span><b id="ac">0/300</b></div></div></header><main class="grid"><section class="card hero"><div class="muted">CARTER ENERGY</div><div class="balance" id="bal">0 <small>clicks</small></div><div class="click" id="click"><div class="ring"></div><img id="carter" src="carter.png" alt="Carter"></div><div class="combo" id="combo">Click Carter to start.</div><div class="buttons"><button class="btn" id="save">Save</button><button class="btn" id="reset">Reset</button></div></section><section class="card side"><nav class="tabs"><button class="tab active" data-t="up">Upgrades</button><button class="tab" data-t="ach">Achievements <span id="act">0/300</span></button><button class="tab" data-t="stats">Stats</button></nav><div id="up" class="panel"><h2>Upgrade Shop</h2><div class="list" id="upgrades"></div></div><div id="ach" class="panel hidden"><h2>300 Achievements</h2><div class="list" id="achievements"></div></div><div id="stats" class="panel hidden"><h2>Statistics</h2><div class="list" id="statistics"></div></div></section></main></div><script>
const $=x=>document.querySelector(x), S={clicks:0,total:0,power:1,cps:0,combo:0,best:0,crit:0,owned:Array(100).fill(0),ach:new Set(),start:Date.now()};
const names=['Better Mouse','Faster Mouse','Mechanical Keyboard','RGB Keyboard','Gaming Mouse','Mousepad XL','Second Monitor','Vertical Monitor','Monitor Arm','Desk Mat','Desk Upgrade','Cable Management','USB Hub','Webcam','Studio Mic','Mic Arm','LED Strip','Desk Lamp','Wi-Fi Upgrade','Ethernet','SSD','Fast SSD','NVMe Drive','Extra RAM','32GB RAM','64GB RAM','CPU Cooler','Liquid Cooler','Power Supply','Case Fan','Case Upgrade','GPU Stand','Budget GPU','Midrange GPU','High-End GPU','Extreme GPU','GPU Overclock','CPU Upgrade','CPU Overclock','Motherboard','Capture Card','Stream Deck','Headphones','Headphone Amp','Speakers','Studio Lights','Camera Upgrade','Lens Upgrade','Tripod','Backdrop','Editing PC','Rendering Farm','Second PC','Server','NAS','Backup Drive','Cloud Backup','Fiber Internet','Router Upgrade','Network Switch','Game Library','Steam Deck','Console Corner','VR Setup','Racing Wheel','Flight Stick','Controller Rack','Arcade Stick','Gaming Chair','Footrest','Standing Desk','Mini Fridge','Snack Drawer','Carter Poster','Carter Statue','Carter Billboard','Carter Drone','Carter Bot','Carter AI','Carter Satellite','Algorithm Boost','Thumbnail Lab','Video Editor','Render Preset','Sponsor Deal','Editor Team','Production Team','Studio Space','Mega Studio','Broadcast Tower','Data Center','Quantum Mouse','Quantum Keyboard','Quantum PC','Quantum GPU','Infinite SSD','Infinite RAM','Infinite CPU','Time Machine','The Final Setup'];
const ups=names.map((n,i)=>({name:n,cost:Math.floor(25*Math.pow(1.14,i)),power:i+1,passive:i%5===4?Math.floor(i/5)+1:0}));
let achievements=[];for(let i=0;i<300;i++){let target=Math.floor(100*Math.pow(1.055,i));achievements.push({name:['Getting Started','Click Machine','Carter Energy','No Mouse Left Behind','Big Numbers'][i%5]+' '+(i+1),target,desc:'Reach '+fmt(target)+' total clicks.'})}
function fmt(n){let u=['','K','M','B','T','Qa','Qi','Sx','Sp','Oc','No'];let i=0;while(n>=1000&&i<u.length-1)n/=1000,i++;return i?n.toFixed(n<10?2:n<100?1:0)+u[i]:Math.floor(n).toLocaleString()}
function toast(a,b){let x=document.createElement('div');x.className='toast';x.innerHTML='<b>'+a+'</b><span>'+b+'</span>';$('body').append(x);setTimeout(()=>x.remove(),2800)}
function render(){ $('#bal').innerHTML=fmt(S.clicks)+' <small>clicks</small>';$('#pc').textContent=fmt(S.power);$('#cps').textContent=fmt(S.cps);$('#ac').textContent=S.ach.size+'/300';$('#act').textContent=S.ach.size+'/300';$('#combo').textContent=S.combo>1?S.combo+' click combo':'Click Carter to start.';$('#upgrades').innerHTML=ups.map((u,i)=>{let cost=Math.floor(u.cost*Math.pow(1.18,S.owned[i]));return `<div class="item"><div><h3>${u.name} <span class="muted">Lv.${S.owned[i]}</span></h3><p>+${u.power} per click${u.passive?' • +'+u.passive+'/sec':''}</p></div><div><div class="price">${fmt(cost)}</div><button class="buy" ${S.clicks<cost?'disabled':''} onclick="buy(${i})">Buy</button></div></div>`}).join('');$('#achievements').innerHTML=achievements.map((a,i)=>`<div class="item ach ${S.ach.has(i)?'unlocked':''}"><div class="icon">${S.ach.has(i)?'★':'?'}</div><div><h3>${a.name}</h3><p>${a.desc}</p></div><span class="muted">${S.ach.has(i)?'UNLOCKED':fmt(Math.min(S.total,a.target))+'/'+fmt(a.target)}</span></div>`).join('');$('#statistics').innerHTML=[['Total clicks',fmt(S.total)],['Current clicks',fmt(S.clicks)],['Click power',fmt(S.power)],['Clicks/sec',fmt(S.cps)],['Best combo',S.best],['Critical clicks',S.crit],['Upgrades owned',S.owned.reduce((a,b)=>a+b,0)],['Achievements',S.ach.size+'/300']].map(x=>`<div class="item"><h3>${x[0]}</h3><b>${x[1]}</b></div>`).join('')}
function check(){achievements.forEach((a,i)=>{if(!S.ach.has(i)&&S.total>=a.target){S.ach.add(i);toast('Achievement unlocked',a.name)}})}
function buy(i){let u=ups[i],cost=Math.floor(u.cost*Math.pow(1.18,S.owned[i]));if(S.clicks<cost)return;S.clicks-=cost;S.owned[i]++;S.power+=u.power;S.cps+=u.passive;toast('Upgrade purchased',u.name);render();save()}
$('#click').onclick=e=>{let mult=Math.random()<.05?5:1;if(mult===5){S.crit++;toast('CRITICAL CLICK','5× Carter energy')}S.combo++;S.best=Math.max(S.best,S.combo);let gain=Math.floor(S.power*mult*(1+Math.floor(S.combo/10)*.1));S.clicks+=gain;S.total+=gain;check();render()};
setInterval(()=>{if(S.cps){S.clicks+=S.cps;S.total+=S.cps;check();render()}if(S.combo){S.combo=Math.max(0,S.combo-1);render()}},1000);
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');['up','ach','stats'].forEach(x=>$('#'+x).classList.toggle('hidden',x!==b.dataset.t))});
function save(){localStorage.cc=JSON.stringify({...S,ach:[...S.ach]})}function load(){try{let x=JSON.parse(localStorage.cc);Object.assign(S,x);S.ach=new Set(x.ach||[])}catch{}}$('#save').onclick=()=>{save();toast('Saved','Progress saved in this browser.')};$('#reset').onclick=()=>{if(confirm('Reset all progress?')){localStorage.removeItem('cc');location.reload()}};load();render();
</script></body></html>
